<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tugas Kuliah</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Tugas</h1>
    <form id="form-tugas">
      <label for="isian">Tugas baru</label>
      <input id="isian" name="tugas">
      <button type="submit">Tambah</button>
      <p id="pesan" class="pesan"></p>
    </form>
    <ul id="daftar"></ul>
    <h2>Mata kuliah</h2>
    <ul id="matkul"></ul>
    <p>Total SKS: <span id="total">0</span></p>
  </main>
</body>
</html>
